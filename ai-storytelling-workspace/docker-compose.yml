version: '3.8'

services:
  # MySQL 8.0 Database
  mysql:
    image: mysql:8.0
    container_name: storytelling_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-storytelling_workspace}
      MYSQL_USER: ${MYSQL_USER:-storytelling_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-storytelling_pass}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - ./docker/mysql/conf:/etc/mysql/conf.d
    networks:
      - storytelling_network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # phpMyAdmin for Database Management
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: storytelling_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-storytelling_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-storytelling_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      UPLOAD_LIMIT: 100M
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    networks:
      - storytelling_network
    depends_on:
      mysql:
        condition: service_healthy

  # Redis for Caching
  redis:
    image: redis:7-alpine
    container_name: storytelling_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - storytelling_network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_pass}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application (FastAPI)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storytelling_app
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-storytelling_user}:${MYSQL_PASSWORD:-storytelling_pass}@mysql:3306/${MYSQL_DATABASE:-storytelling_workspace}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      
      # AI Providers
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      # Application
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # API
      API_HOST: 0.0.0.0
      API_PORT: 8000
      
      # Storage
      STORAGE_PATH: /app/storage
      
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src
      - ./storage:/app/storage
      - ./logs:/app/logs
    networks:
      - storytelling_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m uvicorn storytelling_workspace.api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  storytelling_network:
    driver: bridge
